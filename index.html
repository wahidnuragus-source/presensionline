<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Presensi Workshop AI & Penulisan Artikel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); 
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .form-container { 
            background-color: #ffffff; padding: 40px 30px; 
            border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); 
            width: 100%; max-width: 500px; 
        }

        /* Styling Header (Logo & Penyelenggara) */
        .header-wrapper {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-img {
            max-width: 130px; 
            height: auto;
            /* DI SINI PERUBAHANNYA: Mengurangi jarak bawah logo dari 15px menjadi 5px */
            margin-bottom: 5px; 
        }
        .organizer-name {
            font-size: 14px;
            font-weight: 600;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .title-wrapper { text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px solid #f0f2f5; }
        .main-title { font-size: 20px; font-weight: 700; color: #2c3e50; margin-bottom: 5px; }
        .sub-title { font-size: 13px; font-weight: 400; color: #7f8c8d; line-height: 1.5; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 500; font-size: 14px; color: #34495e; margin-bottom: 8px; }
        input[type="text"] { 
            width: 100%; padding: 12px 15px; border: 1px solid #dcdde1; 
            border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 14px;
            color: #2c3e50; background-color: #fbfbfb; transition: all 0.3s ease; 
        }
        input[type="text"]:focus { border-color: #3498db; background-color: #ffffff; outline: none; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15); }
        canvas { border: 2px dashed #bdc3c7; border-radius: 8px; background-color: #fcfcfc; width: 100%; height: 160px; cursor: crosshair; touch-action: none; }
        canvas:hover { border-color: #3498db; }
        .btn { padding: 12px 15px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 15px; font-weight: 600; font-family: 'Poppins', sans-serif; transition: all 0.3s ease; }
        .btn-submit { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin-top: 10px; box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3); }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(118, 75, 162, 0.4); }
        .btn-clear { background-color: transparent; color: #e74c3c; border: 1px solid #fadbd8; margin-top: 10px; font-size: 13px; padding: 8px 15px; }
        .btn-clear:hover { background-color: #fdf2f2; }
        .btn:disabled { background: #a4b0be; cursor: not-allowed; transform: none; box-shadow: none; }
    </style>
</head>
<body>

<div class="form-container">
    
    <!-- BAGIAN LOGO -->
    <div class="header-wrapper">
        <img src="https://pngup.com/v7ez/logo_untann-removebg-preview.png" alt="Logo Universitas Tanjungpura" class="logo-img">
        <p class="organizer-name">PKJP Universitas Tanjungpura</p>
    </div>
    <!-- BATAS BAGIAN LOGO -->

    <div class="title-wrapper">
        <h2 class="main-title">PRESENSI HADIR PESERTA MELALUI ZOOM</h2>
        <p class="sub-title">Workshop Penulisan Artikel Internasional dengan Kombinasi Scopus AI, ChatGPT, dan Grammarly</p>
    </div>

    <form id="presensiForm">
        <div class="form-group">
            <label>Nama Lengkap (beserta gelar):</label>
            <input type="text" id="nama">
        </div>
        <div class="form-group">
            <label>Program Studi / Jurusan:</label>
            <input type="text" id="prodi">
        </div>
        <div class="form-group">
            <label>Fakultas:</label>
            <input type="text" id="fakultas">
        </div>
        <div class="form-group">
            <label>Universitas:</label>
            <input type="text" id="universitas">
        </div>
        <div class="form-group">
            <label>Tanda Tangan Digital:</label>
            <canvas id="signatureCanvas"></canvas>
            <button type="button" class="btn btn-clear" id="clearBtn">Hapus / Ulangi Tanda Tangan</button>
        </div>
        <button type="submit" class="btn btn-submit" id="submitBtn">Kirim Presensi</button>
    </form>
</div>

<script>
    const canvas = document.getElementById('signatureCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        ctx.scale(ratio, ratio);
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#2c3e50';
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function getMousePos(canvas, evt) {
        var rect = canvas.getBoundingClientRect();
        return {
            x: (evt.clientX || evt.touches[0].clientX) - rect.left,
            y: (evt.clientY || evt.touches[0].clientY) - rect.top
        };
    }

    function startDrawing(e) { isDrawing = true; draw(e); }
    function stopDrawing() { isDrawing = false; ctx.beginPath(); }
    
    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getMousePos(canvas, e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startDrawing, {passive: false});
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('touchmove', draw, {passive: false});

    document.getElementById('clearBtn').addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width / (window.devicePixelRatio || 1), canvas.height / (window.devicePixelRatio || 1));
    });

    document.getElementById('presensiForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsMEAKkS0a0RzIVqjA1H4AtdrbjDCTwMCJY2YD6zDUUAGacrdWvctEIKY1fMsN6tGiEw/exec'; 

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = 'Mengirim Data...';
        submitBtn.disabled = true;

        const dataKirim = {
            nama: document.getElementById('nama').value,
            prodi: document.getElementById('prodi').value,
            fakultas: document.getElementById('fakultas').value,
            universitas: document.getElementById('universitas').value,
            signature: canvas.toDataURL('image/png')
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(dataKirim)
        })
        .then(response => response.text())
        .then(result => {
            alert('Berhasil! Data Anda telah tersimpan.');
            document.getElementById('presensiForm').reset();
            ctx.clearRect(0, 0, canvas.width / (window.devicePixelRatio || 1), canvas.height / (window.devicePixelRatio || 1));
            submitBtn.innerText = 'Kirim Presensi';
            submitBtn.disabled = false;
        })
        .catch(error => {
            alert('Gagal mengirim data. Silakan coba lagi.');
            submitBtn.innerText = 'Kirim Presensi';
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
